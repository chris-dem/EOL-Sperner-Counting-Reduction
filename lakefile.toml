name = "PPADParsimoniousReductions"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["PPADParsimoniousReductions"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3


[[require]]
name = "cslib"
path = "../shared/cslib"

[[require]]
name =  "proofwidgets"
scope = "leanprover-community" 

[[require]]
name = "checkdecls"
scope = "PatrickMassot"
rev = "master"

[[require]]
name = "AlgoLib"
git = "https://github.com/cslib-community/AlgoLib.git"
rev = "main"

# Keep mathlib last so its transitive dependency versions take precedence.
[[require]]
name = "mathlib"
path = "../shared/mathlib4"

[[lean_lib]]
name = "PPADParsimoniousReductions"
